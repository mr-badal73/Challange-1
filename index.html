<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Prize Finder</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Smart Prize Finder</h1>
        <p>Find products closest to your needs</p>
    </header>
    <main>

   <section class="search-section">
    <h2>Search for Products</h2>
    <input
        type="number"
        id="priceInput"
        placeholder="Target price"
    >
    <button id="searchBtn">Search</button>
    <hr>
    <h2>Find Products in Range</h2>
    <input
        type="number"
        id="minPrice"
        placeholder="Minimum price"
    >
    <input
        type="number"
        id="maxPrice"
        placeholder="Maximum price"
    >
    <button id="rangeBtn">Find in Range</button>
</section>
    <section class="product-section">
        <h2>Closest Products</h2>
        <div id="results"></div>
    </section>
</main>
    <script src="js/data.js"></script>
    <script src="js/features/search.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
